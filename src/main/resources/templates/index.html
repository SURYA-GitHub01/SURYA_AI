<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SURYA AI | Executive Assistant</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 20%, #1e293b, #0f172a 70%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
        }

        .app-container {
            width: 95%;
            max-width: 1200px;
            height: 92vh;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        /* HEADER */
        .header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 40px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 3px;
        padding: 12px 28px;
        border-radius: 14px;

        /* Dark premium shade */
        background: linear-gradient(145deg, #0b1220, #111827);
        border: 1px solid rgba(255,255,255,0.06);

        color: #e5e7eb;

        box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 8px 25px rgba(0,0,0,0.6);

        transition: 0.3s ease;
        }

       .logo:hover {
            background: linear-gradient(145deg, #111827, #1f2937);
            box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.08),
                  0 12px 35px rgba(0,0,0,0.8);
}

        /* CHAT AREA */
        .chat-container {
            flex: 1;
            padding: 50px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .message {
            max-width: 65%;
            padding: 20px 24px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.8;
            animation: fadeIn 0.25s ease-in-out;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
            border-bottom-right-radius: 6px;
            box-shadow: 0 10px 30px rgba(37,99,235,0.4);
        }

        .ai {
            align-self: flex-start;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-bottom-left-radius: 6px;
        }

        /* INPUT */
        .input-area {
            padding: 30px 40px;
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            gap: 15px;
        }

        .input-area input {
            flex: 1;
            padding: 18px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-area input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59,130,246,0.5);
        }

        .input-area button {
            padding: 18px 32px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(37,99,235,0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="app-container">

    <div class="header">
        <div class="logo">SURYA AI</div>
    </div>

    <div class="chat-container">
        <div class="message user" th:if="${question}">
            <span th:text="${question}"></span>
        </div>

        <div class="message ai" th:if="${answer}">
            <span th:utext="${answer.replaceAll('\n','<br/>')}"></span>
        </div>
    </div>

    <form action="/ask" class="input-area" method="post">
        <input autocomplete="off" name="question" placeholder="Ask Surya AI..." required type="text"/>
        <button type="submit">Send</button>
    </form>

</div>

</body>
</html>
